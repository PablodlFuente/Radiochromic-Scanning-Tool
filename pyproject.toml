[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiochromic-scanning-tool"
version = "2.0.0"
description = "Desktop analysis software for radiochromic film dosimetry"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
    "Pillow>=10,<13",
    "scipy>=1.10,<2",
    "opencv-python>=4.8,<5",
    "psutil>=5.9,<8",
    "tkcalendar>=1.6,<2",
    "exifread>=3,<4",
]

[project.scripts]
radiochromic-scanning-tool = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "custom_plugins*"]
