name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt build pyinstaller
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = python -c "from app.version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag and app version differ" }
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and executable
        run: |
          python -m build --wheel
          pyinstaller --clean --noconfirm radiochromic_scanning_tool.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = python -c "from app.version import __version__; print(__version__)"
          iscc "/DAppVersion=$version" installer\RadiochromicFilmAnalyzer.iss
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/RadiochromicFilmAnalyzer-Setup.exe
            dist/*.whl
